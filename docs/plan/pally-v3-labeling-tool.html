": "So you can just replace them I think.", "ko": "그냥 교체하면 될 것 같아요."}, {"id": "ES2014d.C.dialog-act.s9553330.63", "ctx": "I don't know whether we're doing it in the wrong order or something or.", "text": "Well, I suppose it's rubber as it is, isn't it.", "ko": "음, 어차피 고무 재질이잖아요, 그렇죠."}, {"id": "Bmr024.D.dialogueact1597", "ctx": "Late July?", "text": "Oh, I think it's July fifteenth.", "ko": "아, 7월 15일인 것 같아요."}];

];

let state = {}; // id -> label record (in-memory draft, mirrors last saved/pending)
let doneIds = new Set();
let idx = 0;
let db = null;

function emptyRecord(item){
  return {
    item_id: item.id,
    target_utterance: item.text,
    context_before: item.ctx || null,
    input_scope: "single_utterance",
    rubric_version: "v2.2",
    protocol_version: "v3.0",
    primary_function: null,
    secondary_function: null,
    function_ambiguous: false,
    language_form: null,
    scores: { Formality: 50, Humor: 50, Curiosity: 50 },
    case_type: { Formality: "clear", Humor: "clear", Curiosity: "clear" },
    confidence: { Formality: 3, Humor: 3, Curiosity: 3 },
    note: "",
    annotator_id: "eunheay",
    label_source: "single_rater_v3_eunheay",
    updatedAt: 0,
  };
}

function fmtPct(n){ return Math.round(n) + "%"; }

async function init(){
  ITEMS.forEach(it => { if(!state[it.id]) state[it.id] = emptyRecord(it); });

  try{
    db = await claude.use("db");
  }catch(e){ db = null; }

  if(db){
    try{
      const snap = await db.collection("labels").get();
      snap.docs.forEach(d => {
        if(!d.exists) return;
        const data = d.data();
        if(data && data.item_id){
          state[data.item_id] = { ...emptyRecord({id:data.item_id,text:data.target_utterance,ctx:data.context_before}), ...data };
          doneIds.add(data.item_id);
        }
      });
    }catch(e){ /* fresh db, nothing saved yet */ }
  }

  idx = ITEMS.findIndex(it => !doneIds.has(it.id));
  if(idx === -1) idx = ITEMS.length; // all done
  render();
}

async function saveCurrent(auto){
  const item = ITEMS[idx];
  if(!item) return;
  const rec = state[item.id];
  rec.updatedAt = Date.now();
  const statusEl = document.getElementById("statusLine");
  if(!db){
    if(statusEl){ statusEl.textContent = "저장소 연결 안 됨 — 로그인 상태를 확인하세요"; statusEl.className = "status-line err"; }
    return false;
  }
  try{
    await db.collection("labels").doc(item.id).set(rec);
    doneIds.add(item.id);
    if(statusEl){ statusEl.textContent = auto ? "자동 저장됨" : "저장됨"; statusEl.className = "status-line ok"; }
    return true;
  }catch(e){
    if(statusEl){ statusEl.textContent = "저장 실패 — 다시 시도해주세요 (" + (e && e.message ? e.message : e) + ")"; statusEl.className = "status-line err"; }
    return false;
  }
}

function go(delta){
  idx = Math.max(0, Math.min(ITEMS.length, idx + delta));
  render();
}
function jumpTo(i){ idx = i; render(); }

function render(){
  const total = ITEMS.length;
  document.getElementById("countLabel").textContent = `${doneIds.size}/${total}`;
  document.getElementById("barFill").style.width = fmtPct((doneIds.size/total)*100);

  const main = document.getElementById("main");
  if(idx >= total){
    main.innerHTML = `<div class="done-screen"><h2>150개 완료</h2><p>${doneIds.size}/${total}개 저장됨. 이전 항목은 아래에서 다시 열 수 있습니다.</p></div>`;
    renderJumpStrip(main, null);
    return;
  }

  const item = ITEMS[idx];
  const rec = state[item.id];

  main.innerHTML = "";
  const card = document.createElement("div");
  card.className = "card";

  card.innerHTML = `
    ${item.ctx ? `<p class="ctx">${escapeHtml(item.ctx)}</p>` : ""}
    <p class="target">${escapeHtml(item.text)}</p>
    ${item.ko ? `<p class="target-ko">${escapeHtml(item.ko)}</p>` : ""}
    <div class="id-tag">${escapeHtml(item.id)} · ${idx+1}/${total}</div>
  `;

  // primary function
  const fnBlock = document.createElement("div");
  fnBlock.style.marginTop = "18px";
  fnBlock.innerHTML = `<p class="section-label">주 발화 기능</p>`;
  const fnRow = document.createElement("div"); fnRow.className = "chip-row";
  FUNCTIONS.forEach(([key,label]) => {
    const chip = document.createElement("button");
    chip.type = "button";
    chip.className = "chip" + (rec.primary_function===key ? " on" : "");
    chip.textContent = label;
    chip.onclick = () => { rec.primary_function = key; render(); };
    fnRow.appendChild(chip);
  });
  fnBlock.appendChild(fnRow);
  const ambigWrap = document.createElement("label");
  ambigWrap.style.cssText = "display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12px;color:var(--text-dim);";
  ambigWrap.innerHTML = `<input type="checkbox" ${rec.function_ambiguous?"checked":""}> 기능 판정 애매함(function_ambiguous)`;
  ambigWrap.querySelector("input").onchange = (e) => { rec.function_ambiguous = e.target.checked; };
  fnBlock.appendChild(ambigWrap);
  card.appendChild(fnBlock);

  // language form
  const lfBlock = document.createElement("div");
  lfBlock.style.marginTop = "16px";
  lfBlock.innerHTML = `<p class="section-label">문법·비표준 상태</p>`;
  const lfRow = document.createElement("div"); lfRow.className = "chip-row";
  LANGUAGE_FORMS.forEach(([key,label]) => {
    const chip = document.createElement("button");
    chip.type = "button";
    chip.className = "chip" + (rec.language_form===key ? " on" : "");
    chip.textContent = label;
    chip.onclick = () => { rec.language_form = key; render(); };
    lfRow.appendChild(chip);
  });
  lfBlock.appendChild(lfRow);
  card.appendChild(lfBlock);

  // axes
  AXES.forEach(axis => {
    const box = document.createElement("div");
    box.className = "axis-card";
    const score = rec.scores[axis.key];
    box.innerHTML = `
      <div class="axis-head">
        <span class="axis-name">${axis.label}</span>
        <span class="axis-score">${score}</span>
      </div>
      <div class="stepper">
        <button type="button" data-act="dec">−5</button>
        <input type="range" min="0" max="100" step="5" value="${score}">
        <button type="button" data-act="inc">+5</button>
      </div>
      <button type="button" class="anchor-toggle">앵커 보기</button>
      <div class="anchor-box" hidden>${axis.anchor}</div>
      <div class="mini-row">
        <div class="mini-field">
          <label>case_type</label>
          <select data-field="case_type">
            ${CASE_TYPES.map(([v]) => `<option value="${v}" ${rec.case_type[axis.key]===v?"selected":""}>${v}</option>`).join("")}
          </select>
        </div>
        <div class="mini-field">
          <label>confidence</label>
          <select data-field="confidence">
            ${[0,1,2,3,4].map(v => `<option value="${v}" ${rec.confidence[axis.key]===v?"selected":""}>${v}</option>`).join("")}
          </select>
        </div>
      </div>
    `;
    const range = box.querySelector("input[type=range]");
    const scoreLabel = box.querySelector(".axis-score");
    const setScore = (v) => {
      v = Math.max(0, Math.min(100, v));
      rec.scores[axis.key] = v;
      range.value = v;
      scoreLabel.textContent = v;
    };
    range.oninput = () => setScore(Number(range.value));
    box.querySelector('[data-act="dec"]').onclick = () => setScore(rec.scores[axis.key]-5);
    box.querySelector('[data-act="inc"]').onclick = () => setScore(rec.scores[axis.key]+5);
    box.querySelector(".anchor-toggle").onclick = (e) => {
      const el = box.querySelector(".anchor-box");
      el.hidden = !el.hidden;
    };
    box.querySelector('[data-field="case_type"]').onchange = (e) => { rec.case_type[axis.key] = e.target.value; };
    box.querySelector('[data-field="confidence"]').onchange = (e) => { rec.confidence[axis.key] = Number(e.target.value); };
    card.appendChild(box);
  });

  // note
  const noteWrap = document.createElement("div");
  noteWrap.style.marginTop = "14px";
  noteWrap.innerHTML = `<p class="section-label">메모 (선택)</p>`;
  const noteInput = document.createElement("textarea");
  noteInput.className = "note-input";
  noteInput.value = rec.note || "";
  noteInput.oninput = (e) => { rec.note = e.target.value; };
  noteWrap.appendChild(noteInput);
  card.appendChild(noteWrap);

  main.appendChild(card);

  // nav
  const nav = document.createElement("div");
  nav.className = "nav-row";
  nav.innerHTML = `
    <button type="button" class="btn btn-ghost" id="prevBtn" ${idx===0?"disabled":""}>이전</button>
    <button type="button" class="btn btn-primary" id="nextBtn">저장하고 다음</button>
  `;
  main.appendChild(nav);
  const status = document.createElement("div");
  status.className = "status-line"; status.id = "statusLine";
  main.appendChild(status);

  document.getElementById("prevBtn").onclick = () => go(-1);
  document.getElementById("nextBtn").onclick = async () => {
    const ok = await saveCurrent(false);
    if(ok) go(1);
  };

  renderJumpStrip(main, idx);
}

function renderJumpStrip(main, currentIdx){
  const strip = document.createElement("div");
  strip.className = "jump-strip";
  ITEMS.forEach((it, i) => {
    const dot = document.createElement("button");
    dot.type = "button";
    dot.className = "jump-dot" + (doneIds.has(it.id) ? " done" : "") + (i===currentIdx ? " current" : "");
    dot.title = `${i+1}. ${it.id}`;
    dot.onclick = () => jumpTo(i);
    strip.appendChild(dot);
  });
  main.appendChild(strip);
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

init();
</script>
